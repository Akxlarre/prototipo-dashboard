<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Lista de Máquinas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/_icons.css">
    <link rel="stylesheet" href="css/components/_layout.css">
    <link rel="stylesheet" href="css/components/_buttons.css">
    <link rel="stylesheet" href="css/components/_inputs.css">
    <link rel="stylesheet" href="css/components/_forms.css">
    <link rel="stylesheet" href="css/components/_cards.css">
    <link rel="stylesheet" href="css/components/_table.css">
    <link rel="stylesheet" href="css/components/_modal.css">
    <link rel="stylesheet" href="css/components/_alert-row.css">
    <link rel="stylesheet" href="css/components/_chart-controls.css">
    <link rel="stylesheet" href="css/components/_chart.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__logo"></div>
                <span class="sidebar__app-name">Nombre de la App</span>
            </div>
            <nav class="sidebar__nav">
                <a href="admin-dashboard.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-dashboard"></span>
                    Dashboard
                </a>
                <a href="admin-machines-list.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-maquinas"></span>
                    Máquinas
                </a>
                <a href="admin-drivers-list.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-choferes"></span>
                    Choferes
                </a>
                <a href="admin-accounting.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-contabilidad"></span>
                    Contabilidad
                </a>
                <a href="admin-reports.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-reportes"></span>
                    Reportes
                </a>
                <div class="sidebar__nav-separator"></div>
                <a href="admin-settings.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-configuracion"></span>
                    Configuración
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-content__header">
                <div>
                    <h1 class="main-content__title">Lista de Máquinas (Microbuses)</h1>
                    <p class="main-content__subtitle">Gestiona todas las máquinas registradas en el sistema.</p>
                </div>
                <a href="admin-machine-create.html" class="btn btn-primary">
                    <span class="icon-plus"></span>
                    Registrar Nueva Máquina
                </a>
            </header>

            <!-- Resumen de Flota - KPIs (Job-to-be-Done: respuesta en menos de 3 segundos) -->
            <div class="main-content__grid">
                <div class="card">
                    <div class="card__body">
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: var(--font-weight-bold); color: var(--color-state-success); margin-bottom: var(--space-xs);" id="kpi-operativas">3</div>
                            <div style="font-size: var(--font-size-desktop-label); color: var(--color-text-secondary);">Máquinas Operativas</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: var(--font-weight-bold); color: var(--color-state-warning); margin-bottom: var(--space-xs);" id="kpi-taller">1</div>
                            <div style="font-size: var(--font-size-desktop-label); color: var(--color-text-secondary);">En Taller</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: var(--font-weight-bold); color: var(--color-text-disabled); margin-bottom: var(--space-xs);" id="kpi-inactivas">1</div>
                            <div style="font-size: var(--font-size-desktop-label); color: var(--color-text-secondary);">Inactivas</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div style="text-align: center;">
                            <div style="font-size: 2rem; font-weight: var(--font-weight-bold); color: var(--color-state-error); margin-bottom: var(--space-xs);" id="kpi-docs-vencer">1</div>
                            <div style="font-size: var(--font-size-desktop-label); color: var(--color-text-secondary);">Documentos por Vencer</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Máquinas como Tarjetas de Estado (Job-to-be-Done: información accionable) -->
            <div class="main-content__grid" id="machines-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                <!-- Las tarjetas se generarán dinámicamente con JavaScript -->
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ============================================
            // DATOS DE MÁQUINAS (Fuente de Verdad)
            // ============================================
            const machinesData = [
                {
                    number: '05',
                    brand: 'Mercedes-Benz',
                    plate: 'ABCD-12',
                    driver: 'Juan Pérez',
                    status: 'Operativa',
                    documents: {
                        revision: '2023-11-20', // Vencida
                        permit: '2024-03-31',   // Al día
                        insurance: '2024-01-15' // Vence pronto
                    }
                },
                {
                    number: '02',
                    brand: 'Caio',
                    plate: 'EFGH-34',
                    driver: 'María Gómez',
                    status: 'Operativa',
                    documents: {
                        revision: '2024-12-31',
                        permit: '2024-12-31',
                        insurance: '2024-12-31'
                    }
                },
                {
                    number: '07',
                    brand: 'Mercedes-Benz',
                    plate: 'IJKL-56',
                    driver: 'Pedro López',
                    status: 'En Taller',
                    documents: {
                        revision: '2024-11-30',
                        permit: '2024-11-30',
                        insurance: '2024-11-30'
                    }
                },
                {
                    number: '03',
                    brand: 'Marcopolo',
                    plate: 'MNOP-78',
                    driver: '(Sin Asignar)',
                    status: 'Inactiva',
                    documents: {
                        revision: '2024-10-15', // Vencida
                        permit: '2024-10-15',   // Vencida
                        insurance: '2024-10-15' // Vencida
                    }
                }
            ];
            
            // ============================================
            // FUNCIONES AUXILIARES
            // ============================================
            const getDocStatus = (dateValue) => {
                if (!dateValue) {
                    return { text: 'Sin fecha', className: 'status-pill--warning', severity: 'warning' };
                }
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const date = new Date(dateValue);
                date.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((date - today) / (1000 * 60 * 60 * 24));
                
                if (Number.isNaN(diffDays)) {
                    return { text: 'Fecha inválida', className: 'status-pill--error', severity: 'error' };
                }
                if (diffDays < 0) {
                    return { text: 'VENCIDA', className: 'status-pill--error', severity: 'error' };
                }
                if (diffDays <= 10) {
                    return { text: `Vence en ${diffDays} días`, className: 'status-pill--warning', severity: 'warning' };
                }
                return { text: 'Al día', className: 'status-pill--ok', severity: 'ok' };
            };
            
            const getStatusPillClass = (status) => {
                switch(status) {
                    case 'Operativa': return 'status-pill--ok';
                    case 'En Taller': return 'status-pill--warning';
                    case 'Inactiva': return 'status-pill--error';
                    default: return 'status-pill--warning';
                }
            };
            
            // ============================================
            // RENDERIZAR TARJETAS DE MÁQUINAS
            // ============================================
            const renderMachineCards = () => {
                const grid = document.getElementById('machines-grid');
                if (!grid) return;
                
                grid.innerHTML = '';
                
                if (machinesData.length === 0) {
                    // Estado vacío
                    const emptyCard = document.createElement('div');
                    emptyCard.className = 'card';
                    emptyCard.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: var(--space-xxl);';
                    emptyCard.innerHTML = `
                        <div class="card__body">
                            <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.5;">
                                <span class="sidebar__nav-item-icon icon-maquinas" style="width: 48px; height: 48px; display: inline-block;"></span>
                            </div>
                            <h3 style="font-size: var(--font-size-desktop-base); font-weight: var(--font-weight-semi-bold); color: var(--color-text-primary); margin-bottom: var(--space-xs);">
                                No hay máquinas registradas
                            </h3>
                            <p style="font-size: var(--font-size-desktop-label); color: var(--color-text-secondary); margin-bottom: var(--space-xl);">
                                Comienza registrando tu primera máquina en el sistema.
                            </p>
                            <a href="admin-machine-create.html" class="btn btn-primary">
                                <span class="icon-plus"></span>
                                Registrar Nueva Máquina
                            </a>
                        </div>
                    `;
                    grid.appendChild(emptyCard);
                    return;
                }
                
                machinesData.forEach(machine => {
                    const revStatus = getDocStatus(machine.documents.revision);
                    const permitStatus = getDocStatus(machine.documents.permit);
                    const insuranceStatus = getDocStatus(machine.documents.insurance);
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card__header" style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 class="card__header-title">Máquina ${machine.number} - ${machine.brand}</h3>
                            <span class="status-pill ${getStatusPillClass(machine.status)}">${machine.status}</span>
                        </div>
                        <div class="card__body">
                            <p><strong>Patente:</strong> ${machine.plate}</p>
                            <p><strong>Chofer Asignado:</strong> ${machine.driver}</p>
                            
                            <hr style="margin: var(--space-md) 0; border: none; border-top: 1px solid var(--color-border-light);">
                            
                            <h4 style="font-weight: var(--font-weight-medium); color: var(--color-text-secondary); font-size: 0.8rem; margin-bottom: var(--space-xs); text-transform: uppercase; letter-spacing: 0.5px;">Estado de Documentos</h4>
                            <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: var(--font-size-desktop-label);">Revisión Técnica</span>
                                    <span class="status-pill ${revStatus.className}">${revStatus.text}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: var(--font-size-desktop-label);">Permiso de Circulación</span>
                                    <span class="status-pill ${permitStatus.className}">${permitStatus.text}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: var(--font-size-desktop-label);">Seguro</span>
                                    <span class="status-pill ${insuranceStatus.className}">${insuranceStatus.text}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card__footer" style="background-color: transparent;">
                            <a href="admin-machine-detail.html" class="btn btn-secondary" style="width: 100%;">Gestionar Máquina</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            };
            
            // ============================================
            // CALCULAR KPIs
            // ============================================
            const calculateKPIs = () => {
                let operativas = 0;
                let enTaller = 0;
                let inactivas = 0;
                let docsVencer = 0;
                
                machinesData.forEach(machine => {
                    if (machine.status === 'Operativa') operativas++;
                    else if (machine.status === 'En Taller') enTaller++;
                    else if (machine.status === 'Inactiva') inactivas++;
                    
                    // Contar documentos por vencer o vencidos
                    const docs = machine.documents;
                    if (getDocStatus(docs.revision).severity !== 'ok' ||
                        getDocStatus(docs.permit).severity !== 'ok' ||
                        getDocStatus(docs.insurance).severity !== 'ok') {
                        docsVencer++;
                    }
                });
                
                const kpiOperativas = document.getElementById('kpi-operativas');
                const kpiTaller = document.getElementById('kpi-taller');
                const kpiInactivas = document.getElementById('kpi-inactivas');
                const kpiDocsVencer = document.getElementById('kpi-docs-vencer');
                
                if (kpiOperativas) kpiOperativas.textContent = operativas;
                if (kpiTaller) kpiTaller.textContent = enTaller;
                if (kpiInactivas) kpiInactivas.textContent = inactivas;
                if (kpiDocsVencer) kpiDocsVencer.textContent = docsVencer;
            };
            
            // ============================================
            // INICIALIZAR
            // ============================================
            calculateKPIs();
            renderMachineCards();
        });
    </script>
</body>
</html>
