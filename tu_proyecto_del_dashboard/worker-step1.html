<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajador - Kilometraje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/_mobile-layout.css">
    <link rel="stylesheet" href="css/components/_buttons.css">
    <link rel="stylesheet" href="css/components/_inputs.css">
    <link rel="stylesheet" href="css/components/_forms.css">
</head>
<body>
    <div class="mobile-app-container">
        <main class="mobile-content">
            <header class="mobile-header mobile-header--align-left">
                <p style="font-size: var(--font-size-mobile-label); color: var(--color-text-secondary); margin-bottom: var(--space-xs);">
                    Paso 1 de 3: Kilometraje
                </p>
                <h1 class="mobile-header__title">Reporte de Hoy</h1>
                <p class="mobile-header__subtitle">Máquina Asignada: 05</p>
                <p class="mobile-header__subtitle">Fecha: Viernes, 14 de Noviembre</p>
            </header>

            <div class="form-field form-field--mobile">
                <label for="initial-km" class="form-field__label">KILOMETRAJE INICIAL</label>
                <input type="number" id="initial-km" class="input-text input-mobile-height" placeholder="0">
            </div>

            <div class="form-field form-field--mobile">
                <label for="final-km" class="form-field__label">KILOMETRAJE FINAL</label>
                <input type="number" id="final-km" class="input-text input-mobile-height" placeholder="0">
            </div>

            <a href="worker-step2.html" class="btn btn-primary btn-full-width btn-mobile-height" id="next-button">Siguiente</a>
        </main>

        <nav class="mobile-nav-bar">
            <a href="worker-home.html" class="mobile-nav-item">
                <svg class="mobile-nav-item__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Reportar
            </a>
            <a href="worker-history.html" class="mobile-nav-item">
                <svg class="mobile-nav-item__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3H6v18h12V9h-5V3zm2 14h-2v-4h2v4zm0-6h-2V7h2v4z"/></svg>
                Mi Historial
            </a>
        </nav>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Lógica simple para habilitar/deshabilitar el botón "Siguiente"
        document.addEventListener('DOMContentLoaded', () => {
            const initialKmInput = document.getElementById('initial-km');
            const finalKmInput = document.getElementById('final-km');
            const nextButton = document.getElementById('next-button');

            function checkInputs() {
                const initialKm = initialKmInput.value.trim();
                const finalKm = finalKmInput.value.trim();
                
                // Habilitar si ambos tienen un valor y el final es mayor o igual al inicial
                if (initialKm !== '' && finalKm !== '' && parseFloat(finalKm) >= parseFloat(initialKm)) {
                    nextButton.removeAttribute('disabled');
                    nextButton.classList.remove('btn-primary--disabled'); // Si tienes una clase visual para deshabilitado
                } else {
                    nextButton.setAttribute('disabled', 'true');
                    nextButton.classList.add('btn-primary--disabled');
                }
            }

            initialKmInput.addEventListener('input', checkInputs);
            finalKmInput.addEventListener('input', checkInputs);

            // Estado inicial del botón
            checkInputs();
        });
    </script>
</body>
</html>
