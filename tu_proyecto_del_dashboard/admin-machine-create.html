<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Registrar Máquina</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/_icons.css">
    <link rel="stylesheet" href="css/components/_layout.css">
    <link rel="stylesheet" href="css/components/_buttons.css">
    <link rel="stylesheet" href="css/components/_inputs.css">
    <link rel="stylesheet" href="css/components/_forms.css">
    <link rel="stylesheet" href="css/components/_cards.css">
    <link rel="stylesheet" href="css/components/_table.css">
    <link rel="stylesheet" href="css/components/_modal.css">
    <link rel="stylesheet" href="css/components/_alert-row.css">
    <link rel="stylesheet" href="css/components/_chart-controls.css">
    <link rel="stylesheet" href="css/components/_chart.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__logo"></div>
                <span class="sidebar__app-name">Nombre de la App</span>
            </div>
            <nav class="sidebar__nav">
                <a href="admin-dashboard.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-dashboard"></span>
                    Dashboard
                </a>
                <a href="admin-machines-list.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-maquinas"></span>
                    Máquinas
                </a>
                <a href="admin-drivers-list.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-choferes"></span>
                    Choferes
                </a>
                <a href="admin-accounting.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-contabilidad"></span>
                    Contabilidad
                </a>
                <a href="admin-reports.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-reportes"></span>
                    Reportes
                </a>
                <div class="sidebar__nav-separator"></div>
                <a href="admin-settings.html" class="sidebar__nav-item">
                    <span class="sidebar__nav-item-icon icon-configuracion"></span>
                    Configuración
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-content__header">
                <h1 class="main-content__title">Registrar Nueva Máquina</h1>
                <p class="main-content__subtitle">Completa la información para añadir una nueva máquina al sistema.</p>
            </header>

            <div class="card" style="max-width: 800px;"> 
                <div class="card__header">
                    <h2 class="card__header-title">Datos de la Máquina</h2>
                </div>
                <div class="card__body">
                    <form>
                        <div class="form-field">
                            <label for="machine-number" class="form-field__label">Número de Máquina</label>
                            <input type="text" id="machine-number" class="input-text" placeholder="Ej: 05">
                        </div>
                        <div class="form-field">
                            <label for="machine-brand" class="form-field__label">Marca</label>
                            <input type="text" id="machine-brand" class="input-text" placeholder="Ej: Mercedes-Benz">
                        </div>
                        <div class="form-field">
                            <label for="machine-plate" class="form-field__label">Patente</label>
                            <input type="text" id="machine-plate" class="input-text" placeholder="Ej: ABCD-12">
                        </div>
                        <div class="form-field">
                            <label for="machine-driver" class="form-field__label">Chofer Asignado (Opcional)</label>
                            <select id="machine-driver" class="input-text">
                                <option value="">-- Seleccionar Chofer --</option>
                                <option value="juan-perez">Juan Pérez</option>
                                <option value="maria-gomez">María Gómez</option>
                                <option value="pedro-lopez">Pedro López</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="machine-status" class="form-field__label">Estado Operativo</label>
                            <select id="machine-status" class="input-text">
                                <option value="operative">Operativa</option>
                                <option value="in-repair">En Taller</option>
                                <option value="inactive">Inactiva</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="machine-year" class="form-field__label">Año de Fabricación</label>
                            <input type="number" id="machine-year" class="input-text" placeholder="Ej: 2018">
                        </div>
                        <div class="form-field">
                            <label for="machine-initial-km" class="form-field__label">Kilometraje Inicial</label>
                            <input type="number" id="machine-initial-km" class="input-text" placeholder="Ej: 125000">
                        </div>
                    </form>
                </div>
                <div class="card__footer">
                    <a href="admin-machines-list.html" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" id="save-machine-button">Guardar Máquina</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const saveButton = document.getElementById('save-machine-button');
            const formFields = document.querySelectorAll('.card__body .input-text');

            function checkFormValidity() {
                let allFilled = true;
                formFields.forEach(field => {
                    // Ignorar chofer asignado (es opcional)
                    if (field.id === 'machine-driver') {
                        return;
                    }
                    if (field.type !== 'select-one' && field.value.trim() === '') {
                        allFilled = false;
                    }
                    if (field.type === 'select-one' && field.value === '') {
                        if (field.id !== 'machine-driver') {
                            allFilled = false;
                        }
                    }
                });

                if (allFilled) {
                    saveButton.removeAttribute('disabled');
                    saveButton.classList.remove('btn-primary--disabled');
                } else {
                    saveButton.setAttribute('disabled', 'true');
                    saveButton.classList.add('btn-primary--disabled');
                }
            }

            formFields.forEach(field => {
                field.addEventListener('input', checkFormValidity);
                field.addEventListener('change', checkFormValidity);
            });

            checkFormValidity();
            
            saveButton.addEventListener('click', (e) => {
                if (!saveButton.hasAttribute('disabled')) {
                    e.preventDefault();
                    alert('Máquina registrada exitosamente (simulado)!');
                    window.location.href = 'admin-machines-list.html';
                }
            });
        });
    </script>
</body>
</html>
